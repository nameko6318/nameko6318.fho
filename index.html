<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Multi-Photo & Text App</title>
    <style>
        /* モバイルファースト・リセットスタイル */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* スマホでの「引っ張ってリロード」を物理的に防止 */
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background-color: #121212;
            overflow: hidden; 
            overscroll-behavior-y: contain;
        }

        /* 背景画像ラッパー（Flexboxで隙間なく横並びにする） */
        #bg-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            gap: 0; /* 隙間をゼロに固定 */
            z-index: 1;
        }

        .bg-img {
            flex: 1;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-color: #333;
            transition: background-image 0.4s ease;
        }

        /* 画面共通レイアウト */
        .screen {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top));
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        /* ----------------------------------
           1. 設定画面（スタート画面）のスタイル
        ------------------------------------- */
        #setup-screen {
            justify-content: center;
            align-items: center;
            background-color: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .setup-card {
            width: 100%;
            max-width: 340px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 24px;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .setup-card h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .setup-section {
            margin-bottom: 20px;
            text-align: left;
        }

        .setup-section label.section-title {
            display: block;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            font-weight: 500;
        }

        /* セレクターボタン（共通） */
        .selector-group {
            display: flex;
            gap: 10px;
        }

        .selector-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid transparent;
            color: #ffffff;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .selector-btn.active {
            border-color: #007aff;
            background: rgba(0, 122, 255, 0.2);
        }

        /* 写真選択ボタン */
        .file-label {
            display: block;
            background: #ffffff;
            color: #000000;
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 4px;
        }
        
        .file-status {
            font-size: 0.8rem;
            color: #4cd964;
            text-align: center;
            display: none;
            margin-bottom: 8px;
        }

        /* 開始ボタン */
        .start-btn {
            width: 100%;
            background: #007aff;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
            margin-top: 10px;
        }

        .start-btn:disabled {
            background: #444444;
            color: rgba(255,255,255,0.4);
            box-shadow: none;
            cursor: not-allowed;
        }

        input[type="file"] {
            display: none;
        }

        /* ----------------------------------
           2. メイン画面（テキスト表示）のスタイル
        ------------------------------------- */
        #main-screen {
            display: none;
        }

        /* テキストエリア（完全透明、ボタンなし） */
        #memo-text {
            flex-grow: 1;
            width: 100%;
            background-color: transparent; 
            border: none;
            resize: none;
            outline: none;
            font-size: 16px; /* iPhoneズーム防止 */
            line-height: 1.6;
            padding: 10px;
            -webkit-appearance: none;
            
            /* 強力な文字シャドウ（視認性確保） */
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9), -1px -1px 3px rgba(0, 0, 0, 0.5);
        }

        /* 文字色のクラス */
        .text-color-white { color: #ffffff !important; }
        .text-color-gray { color: #cccccc !important; } /* 背景を邪魔しない明るいグレー */

        #memo-text::placeholder {
            color: rgba(255, 255, 255, 0.4);
            text-shadow: none;
        }
    </style>
</head>
<body>

    <div id="bg-wrapper">
        <div id="bg-img-1" class="bg-img"></div>
        <div id="bg-img-2" class="bg-img"></div>
    </div>

    <div id="setup-screen" class="screen">
        <div class="setup-card">
            <h2>アプリの設定</h2>
            
            <div class="setup-section">
                <label class="section-title">画像の枚数</label>
                <div class="selector-group">
                    <button type="button" class="selector-btn count-btn active" data-count="1">1枚</button>
                    <button type="button" class="selector-btn count-btn" data-count="2">2枚 (横並び)</button>
                </div>
            </div>

            <div class="setup-section">
                <label class="section-title" id="photo-title-1">背景写真</label>
                <label for="image-upload-1" class="file-label">📸 写真を選択する</label>
                <input type="file" id="image-upload-1" accept="image/*">
                <div id="file-status-1" class="file-status">✓ 1枚目が読み込まれました</div>
                
                <div id="photo-2-section" style="display: none; margin-top: 15px;">
                    <label class="section-title">2枚目の写真</label>
                    <label for="image-upload-2" class="file-label">📸 写真を選択する</label>
                    <input type="file" id="image-upload-2" accept="image/*">
                    <div id="file-status-2" class="file-status">✓ 2枚目が読み込まれました</div>
                </div>
            </div>

            <div class="setup-section">
                <label class="section-title">文字の色</label>
                <div class="selector-group">
                    <button type="button" class="selector-btn color-btn active" data-color="white">白色</button>
                    <button type="button" class="selector-btn color-btn" data-color="gray">グレー</button>
                </div>
            </div>

            <button type="button" id="start-btn" class="start-btn" disabled>決定して文章を入力</button>
        </div>
    </div>

    <div id="main-screen" class="screen">
        <textarea id="memo-text" placeholder="ここをタップして文字を入力してください...&#10;&#10;（やり直したい時は、ブラウザの更新ボタンで最初の画面に戻れます）"></textarea>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bgImg1 = document.getElementById('bg-img-1');
            const bgImg2 = document.getElementById('bg-img-2');
            const imageUpload1 = document.getElementById('image-upload-1');
            const imageUpload2 = document.getElementById('image-upload-2');
            const fileStatus1 = document.getElementById('file-status-1');
            const fileStatus2 = document.getElementById('file-status-2');
            const photo2Section = document.getElementById('photo-2-section');
            const photoTitle1 = document.getElementById('photo-title-1');
            
            const countButtons = document.querySelectorAll('.count-btn');
            const colorButtons = document.querySelectorAll('.color-btn');
            const startBtn = document.getElementById('start-btn');
            
            const setupScreen = document.getElementById('setup-screen');
            const mainScreen = document.getElementById('main-screen');
            const memoText = document.getElementById('memo-text');

            let imageCount = 1;
            let selectedColor = 'white';
            let img1URL = null;
            let img2URL = null;

            // 決定ボタンを押せるかチェックする関数
            function validateForm() {
                if (imageCount === 1) {
                    startBtn.disabled = !img1URL;
                } else {
                    startBtn.disabled = !(img1URL && img2URL);
                }
            }

            // 枚数切り替え
            countButtons.forEach(button => {
                button.addEventListener('click', () => {
                    countButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    imageCount = parseInt(button.getAttribute('data-count'), 10);
                    
                    if (imageCount === 1) {
                        photo2Section.style.display = 'none';
                        photoTitle1.textContent = '背景写真';
                    } else {
                        photo2Section.style.display = 'block';
                        photoTitle1.textContent = '1枚目の写真';
                    }
                    validateForm();
                });
            });

            // 文字色切り替え
            colorButtons.forEach(button => {
                button.addEventListener('click', () => {
                    colorButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    selectedColor = button.getAttribute('data-color');
                });
            });

            // 1枚目の写真読み込み
            imageUpload1.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (img1URL) URL.revokeObjectURL(img1URL);
                img1URL = URL.createObjectURL(file);
                bgImg1.style.backgroundImage = `url(${img1URL})`;
                fileStatus1.style.display = 'block';
                validateForm();
            });

            // 2枚目の写真読み込み
            imageUpload2.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (img2URL) URL.revokeObjectURL(img2URL);
                img2URL = URL.createObjectURL(file);
                bgImg2.style.backgroundImage = `url(${img2URL})`;
                fileStatus2.style.display = 'block';
                validateForm();
            });

            // 決定ボタン処理
            startBtn.addEventListener('click', () => {
                // 文字色クラスの適用
                if (selectedColor === 'white') {
                    memoText.classList.add('text-color-white');
                } else {
                    memoText.classList.add('text-color-gray');
                }

                // 枚数に応じて2枚目のエリアを非表示、または表示
                if (imageCount === 1) {
                    bgImg2.style.display = 'none';
                } else {
                    bgImg2.style.display = 'block';
                }

                // 画面の切り替え
                setupScreen.style.display = 'none';
                mainScreen.style.display = 'flex';
                setupScreen.style.backgroundColor = 'transparent'; 
                memoText.focus(); // 自動で入力状態にする
            });
        });
    </script>
</body>
</html>
